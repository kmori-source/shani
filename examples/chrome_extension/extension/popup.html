<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shani Governance</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      width: 380px;
      min-height: 120px;
      background: #f7f8fa;
      color: #1a202c;
    }

    /* ── ヘッダー ── */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      background: #1a202c;
      color: #fff;
    }
    header .logo { font-size: 16px; }
    header h1 { font-size: 14px; font-weight: 600; flex: 1; }
    #status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #718096;
    }
    #status-dot.ok { background: #48bb78; }
    #status-dot.error { background: #fc8181; }

    /* ── コンテンツ ── */
    #content { padding: 10px 12px; }

    #empty {
      text-align: center;
      padding: 20px 0;
      color: #718096;
    }

    /* ── 承認カード ── */
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      border-left: 3px solid #e53e3e;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-action {
      font-weight: 600;
      font-size: 13px;
      color: #2d3748;
    }
    .dsal-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      background: #fed7d7;
      color: #c53030;
    }

    .card-row {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
      font-size: 12px;
      color: #4a5568;
    }
    .label { font-weight: 600; min-width: 70px; color: #718096; }
    .value { word-break: break-all; }

    .evidence-list {
      margin-top: 6px;
      padding-left: 16px;
      font-size: 11px;
      color: #718096;
    }
    .evidence-list li { margin-bottom: 2px; }

    .timeout-row {
      font-size: 11px;
      color: #a0aec0;
      margin-top: 6px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .btn {
      flex: 1;
      padding: 7px 0;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-approve { background: #48bb78; color: #fff; }
    .btn-deny { background: #fc8181; color: #fff; }

    /* ── フッター ── */
    footer {
      padding: 6px 12px;
      font-size: 11px;
      color: #a0aec0;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <span class="logo">🔐</span>
    <h1>Shani Governance</h1>
    <div id="status-dot" title="Sidecar 接続状態"></div>
  </header>

  <div id="content">
    <div id="empty">承認待ちのリクエストはありません</div>
    <div id="cards"></div>
  </div>

  <footer id="footer">サイドカー: http://127.0.0.1:7891 | 3秒ごとに更新</footer>

  <script src="popup.js"></script>
</body>
</html>
