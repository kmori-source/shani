name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Zero-dependency check first — shani must run with stdlib only
      - name: Install shani (no external deps)
        run: pip install -e .
      - name: Zero-dependency E2E check
        run: shani check

      # Install optional deps for full test suite
      - name: Install optional dependencies
        run: pip install pyyaml pytest pydantic cryptography

      # Full test suite via pytest
      - name: Run all test suites
        run: pytest
        continue-on-error: true
        env:
          SHANI_SHANI_BOUNDARY_KEY: "ci-test-boundary-key"
          SHANI_SHANI_AUTHORITY_KEY: "ci-test-authority-key"

      # Verify key examples run without error
      - name: Install example dependencies
        run: pip install pyyaml
      - name: Verify examples
        run: |
          python examples/remediation/scenario.py
          python examples/delegation/scenario.py
          python examples/dis_violation/scenario.py
          python examples/firewall_chain/scenario.py
          SHANI_HITL_AUTO=approve python examples/hitl_approval/scenario.py
        env:
          SHANI_HITL_AUTO: approve

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check shani/ --ignore E501,F401

  spec-check:
    name: Spec conformance check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check requested_dsal is absent from DecisionProposal
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          import types, importlib.util, pathlib
          _spec = importlib.util.spec_from_file_location('_compat', 'shani/_compat.py')
          _mod = importlib.util.module_from_spec(_spec); _spec.loader.exec_module(_mod)
          _shim = types.ModuleType('pydantic')
          for k in ('BaseModel','Field','field_validator','model_validator'): setattr(_shim, k, getattr(_mod, k))
          import sys; sys.modules['pydantic'] = _shim
          import warnings; warnings.filterwarnings('ignore')
          from shani.schemas.decision import DecisionProposal
          import inspect
          src = pathlib.Path('shani/schemas/decision.py').read_text()
          assert 'requested_dsal' not in src or '_requested_dsal' in src, 'requested_dsal must not exist in DecisionProposal'
          print('OK: requested_dsal absent from DecisionProposal')
          "
      - name: Check capability_matrix not hardcoded in boundary
        run: |
          python -c "
          src = open('shani/boundary/capability.py').read()
          assert '_DECISION_TYPE_OPS' not in src, '_DECISION_TYPE_OPS must not exist in capability.py'
          assert 'CapabilityMatrixLoader' not in src, 'CapabilityMatrixLoader must not exist in capability.py'
          print('OK: capability_matrix not hardcoded in boundary')
          "
      - name: Check authority_map not hardcoded in gate
        run: |
          python -c "
          src = open('shani/hitl/approval/gate.py').read()
          assert 'authority_map = {' not in src, 'authority_map must not be hardcoded in gate.py'
          print('OK: authority_map not hardcoded in gate')
          "
      - name: Check DEFAULT_DECISION_POLICY matches policy.yaml
        run: |
          pip install pyyaml -q
          python -c "
          import sys, yaml
          sys.path.insert(0, '.')
          import types, importlib.util, pathlib
          _spec = importlib.util.spec_from_file_location('_compat', 'shani/_compat.py')
          _mod = importlib.util.module_from_spec(_spec); _spec.loader.exec_module(_mod)
          _shim = types.ModuleType('pydantic')
          for k in ('BaseModel','Field','field_validator','model_validator'): setattr(_shim, k, getattr(_mod, k))
          import sys; sys.modules['pydantic'] = _shim
          import warnings; warnings.filterwarnings('ignore')
          from shani.authority.policy import DEFAULT_DECISION_POLICY, CapabilityMatrix
          yaml_src = yaml.safe_load(open('policy/decision_policy.yaml'))
          yaml_policy = yaml_src.get('decision_policy', {})
          mismatches = [f'{k}: default={DEFAULT_DECISION_POLICY[k]}, yaml={v}'
                        for k, v in yaml_policy.items()
                        if k in DEFAULT_DECISION_POLICY and DEFAULT_DECISION_POLICY[k] != int(v)]
          assert not mismatches, f'DEFAULT_DECISION_POLICY mismatches: {mismatches}'
          yaml_cm = yaml_src.get('capability_matrix', {})
          diffs = [f\"{dt}: yaml={sorted(set(e['operations']))} fallback={sorted(CapabilityMatrix._FALLBACK.get(dt,set()))}\"
                        for dt, e in yaml_cm.items()
                        if set(e['operations']) != CapabilityMatrix._FALLBACK.get(dt, set())]
          assert not diffs, f'CapabilityMatrix._FALLBACK mismatches: {diffs}'
          print('OK: defaults match policy.yaml')
          "
