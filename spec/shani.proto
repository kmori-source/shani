// Shani Protocol Buffer Definitions
//
// This file defines the canonical wire format for all Shani data types.
// It is the authoritative protobuf source for cross-language binding interoperability.
//
// Spec version: v0.4
// ADO version:  v5.2
//
// Language bindings MUST implement the canonical JSON rules defined in
// spec/canonicalization.md for signature verification to be interoperable.
// The proto wire format is used for transport; canonical JSON is used for signing.

syntax = "proto3";

package shani.v1;

option go_package = "github.com/kmori-source/shani/gen/go/shani/v1;shaniv1";
option java_package = "io.github.kmori_source.shani.v1";
option java_multiple_files = true;
option java_outer_classname = "ShaniProto";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────────────────────
// Enumerations
// ─────────────────────────────────────────────────────────────

// DecisionType enumerates all action categories an agent may propose.
// Maps to the `decision_type` field in DecisionProposal and ExecContext.
enum DecisionType {
  DECISION_TYPE_UNSPECIFIED = 0;
  DECISION_TYPE_REMEDIATION = 1;
  DECISION_TYPE_CONFIGURATION_CHANGE = 2;
  DECISION_TYPE_DATA_ACCESS = 3;
  DECISION_TYPE_NETWORK_ACTION = 4;
  DECISION_TYPE_DELEGATION = 5;
  DECISION_TYPE_POLICY_UPDATE = 6;
  DECISION_TYPE_BROWSER_ACTION = 7;
  DECISION_TYPE_AGENT_TASK = 8;
  DECISION_TYPE_TOOL_CALL = 9;
}

// BlastRadius enumerates the estimated impact scope of a proposed action.
// Ordered from lowest (ISOLATED) to highest (CRITICAL) impact.
enum BlastRadius {
  BLAST_RADIUS_UNSPECIFIED = 0;
  BLAST_RADIUS_ISOLATED = 1;
  BLAST_RADIUS_LIMITED = 2;
  BLAST_RADIUS_SIGNIFICANT = 3;
  BLAST_RADIUS_CRITICAL = 4;
}

// DISState represents the Decision Integrity State of a Shani evaluator.
// State transitions: VALID → DEGRADED → VIOLATED. VIOLATED → VALID requires
// manual reset with human authority + non-empty justification.
enum DISState {
  DIS_STATE_UNSPECIFIED = 0;
  DIS_STATE_VALID = 1;
  DIS_STATE_DEGRADED = 2;
  DIS_STATE_VIOLATED = 3;
}

// DISSignalType enumerates normative DIS input signal classes (SPEC §4.5).
enum DISSignalType {
  DIS_SIGNAL_TYPE_UNSPECIFIED = 0;
  DIS_SIGNAL_TYPE_ASSUMPTION_DRIFT = 1;
  DIS_SIGNAL_TYPE_AGENT_IDENTITY_DRIFT = 2;
  DIS_SIGNAL_TYPE_ENVIRONMENT_CHANGE = 3;
  DIS_SIGNAL_TYPE_DELEGATION_VIOLATION = 4;
  DIS_SIGNAL_TYPE_REPLAY_ATTACK = 5;
}

// SignalSeverity determines which DIS state transition a signal triggers.
// LOW: log only. MEDIUM: VALID → DEGRADED. HIGH/CRITICAL: * → VIOLATED.
enum SignalSeverity {
  SIGNAL_SEVERITY_UNSPECIFIED = 0;
  SIGNAL_SEVERITY_LOW = 1;
  SIGNAL_SEVERITY_MEDIUM = 2;
  SIGNAL_SEVERITY_HIGH = 3;
  SIGNAL_SEVERITY_CRITICAL = 4;
}

// SignerRole identifies the role of a principal in an ADO signature chain.
enum SignerRole {
  SIGNER_ROLE_UNSPECIFIED = 0;
  SIGNER_ROLE_AUTHORITY = 1;
  SIGNER_ROLE_BOUNDARY = 2;
  SIGNER_ROLE_AGENT = 3;
  SIGNER_ROLE_DELEGATE = 4;
}

// ─────────────────────────────────────────────────────────────
// DecisionProposal — the only input Shani accepts from an agent
// ─────────────────────────────────────────────────────────────

// DecisionProposal is a request for authorization submitted by an agent.
// A proposal is NOT authorization. Agents MUST NOT act on a proposal alone.
// See spec/proposal-schema.json for the normative JSON Schema definition.
message DecisionProposal {
  // UUID v4 — globally unique. Auto-generated by the evaluator if omitted.
  string decision_id = 1;

  DecisionType decision_type = 2;

  // Identifier of the agent submitting this proposal.
  string proposed_by = 3;

  // Human-readable description of the proposed action.
  string description = 4;

  // The resource or system targeted by this proposal.
  string target = 5;

  // Optional scope constraints for this proposal.
  optional DecisionScope scope = 6;

  // Evidence supporting this proposal. Source trust affects risk scoring.
  repeated EvidenceItem evidence = 7;

  // Agent's confidence in this proposal (0.0–1.0).
  double confidence = 8;

  // For delegated decisions: the decision_id of the parent ADO.
  optional string parent_decision_id = 9;

  // Assumptions the agent is making. Drift in these triggers DIS signals.
  repeated string assumptions = 10;

  // Whether this action is reversible. Irreversible actions require stricter governance.
  bool reversibility = 11;

  BlastRadius blast_radius = 12;

  // Whether this proposal requests delegation authority.
  bool delegation = 13;

  // Proposal expiry. Must be in the future. The resulting ADO may not outlast this.
  optional google.protobuf.Timestamp expires_at = 14;

  // Originating organization ID for cross-org ADO issuance (SPEC §8.8).
  optional string origin_org = 15;
}

// DecisionScope constrains the resources this proposal may affect.
message DecisionScope {
  repeated string asset_ids = 1;
  repeated string resource_types = 2;
  optional string geographic_boundary = 3;
  optional int32 max_affected_count = 4;
}

// EvidenceItem is one piece of evidence supporting a DecisionProposal.
// Evidence from SELF_REPORTED sources receives a trust multiplier of 0.35.
message EvidenceItem {
  // Identifier of the evidence source.
  string source = 1;
  string content = 2;
  // Source-declared confidence (0.0–1.0). Distinct from proposal-level confidence.
  optional double confidence = 3;
  optional string raw_reference = 4;
}

// ─────────────────────────────────────────────────────────────
// AuthorizedDecisionObject (ADO v5)
// ─────────────────────────────────────────────────────────────

// AuthorizedDecisionObject is the exclusive authorization artifact issued by
// a Shani-compliant evaluator. An Execution Agent MUST NOT act without a
// valid, unexpired ADO whose signature has been verified.
// See spec/ado-schema.json for the normative JSON Schema definition.
message AuthorizedDecisionObject {
  // Matches the DecisionProposal.decision_id this ADO was issued for.
  string decision_id = 1;

  // SHA-256 hex digest (64 lowercase hex chars) of the canonical DecisionProposal.
  // Verifiers recompute this from the proposal to detect fake ADOs.
  string proposal_hash = 2;

  // Ed25519 signature chain hash over the canonical payload (spec/canonicalization.md §3).
  // Any field modification in the signed payload invalidates this. MUST verify before execution.
  string signature = 3;

  // Human role or policy document that authorized this decision.
  string authority = 4;

  // D-SAL level granted (0–4). Upper bound on what the agent may do autonomously.
  int32 authorized_dsal = 5;

  // Bounds on child delegation chains. All four subfields are part of the signed payload.
  optional DelegationRules delegation_rules = 6;

  // Cryptographically random 32-byte token (hex-encoded, 64 chars). Part of signed payload.
  // Consumed on first execution. Replay fails because nonce is registered in NonceStore.
  string nonce = 7;

  // When this ADO was issued by Shani (UTC).
  google.protobuf.Timestamp issued_at = 8;

  // When this ADO expires (UTC). Agents MUST check expires_at > now() before execution.
  google.protobuf.Timestamp expires_at = 9;

  // Execution metadata included in the signed payload.
  ExecContext exec_context = 10;

  // v5.2: Full ADO signature chain (authority_signature → boundary_signature).
  // Present when multi-principal signing is configured (SPEC §4.6).
  optional ADOSignatureChain signature_chain = 11;

  // v5.1: Constraints inherited from the originating principal's UserPosture
  // for cross-org ADOs. Included in canonical signature payload (SPEC §8.8).
  repeated string propagated_constraints = 12;

  // v5.1: Identifier of the originating organization for cross-org ADOs.
  optional string origin_org = 13;
}

// DelegationRules constrains what child delegation chains derived from this ADO may do.
message DelegationRules {
  // Whitelist of DecisionType values children may propose. Empty = no delegation.
  repeated DecisionType allowed_sub_decisions = 1;

  // Maximum D-SAL a child ADO may be granted. Invariant: max_child_dsal < parent.authorized_dsal.
  int32 max_child_dsal = 2;

  // Remaining delegation hops allowed. Decremented by 1 at each delegation. 0 = leaf node.
  int32 max_depth = 3;

  // Maximum number of direct child ADOs. 0 = no children. Prevents fan-out attacks.
  int32 max_children = 4;
}

// ExecContext carries execution metadata and is included in the signed ADO payload.
message ExecContext {
  DecisionType decision_type = 1;
  IntentBinding intent_binding = 2;
  optional string parent_decision_id = 3;

  // Arbitrary key/value execution constraints. Serialized as a JSON object in canonical form.
  google.protobuf.Struct constraints = 4;

  // Excluded from the canonical signature payload (covered indirectly via proposal_hash).
  optional RollbackPolicy rollback_policy = 5;
}

// IntentBinding is a cryptographically bound statement of what this ADO authorizes.
// Included in ExecContext, which is part of the signed ADO payload.
message IntentBinding {
  string intent = 1;
  string target = 2;
  string scope_summary = 3;
  string expected_effect = 4;
  bool reversibility = 5;
  optional string rollback_reference = 6;
}

// RollbackPolicy defines how to undo this action if needed.
// Excluded from the canonical signature payload.
message RollbackPolicy {
  string strategy = 1;
  int32 rollback_window_seconds = 2;
  bool automated = 3;
  optional string rollback_agent = 4;
}

// ─────────────────────────────────────────────────────────────
// ADO Signature Chain (v5.2)
// ─────────────────────────────────────────────────────────────

// ADOSignatureChain holds the ordered list of signatures for multi-principal signing.
// Chain order MUST be: authority_signature → boundary_signature (SPEC §4.6).
// Each entry covers the canonical payload and all prior signatures.
message ADOSignatureChain {
  repeated SignatureEntry signatures = 1;
}

// SignatureEntry is one entry in an ADO signature chain.
message SignatureEntry {
  string principal_id = 1;
  SignerRole role = 2;

  // Base64-encoded 64-byte Ed25519 signature.
  string signature_b64 = 3;

  google.protobuf.Timestamp signed_at = 4;

  // Base64-encoded 32-byte Ed25519 public key.
  string public_key_b64 = 5;
}

// ─────────────────────────────────────────────────────────────
// UserPosture — principal's Binding declaration (v0.4)
// ─────────────────────────────────────────────────────────────

// UserPosture is the structured expression of a principal's Binding (SPEC §8.1).
// Declares constraints within which an agent's proposals are considered in-scope.
// MUST be signed. MUST remain within OrgPolicy.absolute_constraints.
// See spec/posture-schema.json for the normative JSON Schema definition.
message UserPosture {
  // Semver version of this posture declaration (e.g. "1.0").
  string version = 1;

  // Identity of the principal declaring this posture.
  string principal_id = 2;

  // Timestamp of signature (UTC).
  google.protobuf.Timestamp signed_at = 3;

  // Human-readable statement of delegation intent. Signed as part of the posture.
  string intent_statement = 4;

  // Reference to the PostureSimulationResult used at signing time.
  // Required — prevents Binding Theater (SPEC §8.6).
  string simulation_ref = 5;

  PostureConstraints constraints = 6;

  // Immutable history of previous posture versions. Entries MUST NOT be deleted.
  repeated PostureHistoryEntry history = 7;

  // Base64-encoded Ed25519 or HMAC-SHA256 signature over canonical_content()
  // (excludes posture_signature itself). See spec/canonicalization.md §5.
  optional string posture_signature = 8;
}

// PostureConstraints defines the boundary of actions a principal accepts responsibility for.
// All proposals must satisfy these constraints before reaching RiskPipeline.
message PostureConstraints {
  // Regex or glob pattern for allowed targets (e.g. "host:dev-*").
  // Proposals with non-matching targets receive Layer 1 REJECT.
  string target_scope = 1;

  // Maximum blast radius this principal accepts. Proposals exceeding this receive Layer 1 REJECT.
  BlastRadius max_blast_radius = 2;

  // If true, irreversible proposals receive Layer 1 REJECT.
  bool reversibility_required = 3;

  // Minimum number of evidence items required. Proposals with fewer receive Layer 1 REJECT.
  int32 minimum_evidence = 4;
}

// PostureHistoryEntry is an immutable record of a previous posture version.
message PostureHistoryEntry {
  string version = 1;
  google.protobuf.Timestamp signed_at = 2;
  string note = 3;
}

// ─────────────────────────────────────────────────────────────
// PostureRefinementRequest — first-class evaluation outcome (v0.4)
// ─────────────────────────────────────────────────────────────

// PostureRefinementRequest is returned when the PostureEngine cannot determine
// whether a proposal is within scope. It is NOT a subtype of DeniedDecision.
// Agents MUST halt execution on receipt and notify the principal (SPEC §8.5).
message PostureRefinementRequest {
  // Identity of the proposal that triggered refinement.
  string proposal_id = 1;

  // The posture owner who must act on this request.
  string principal_id = 2;

  // Human-readable explanation of what could not be determined.
  string ambiguity = 3;

  // Constraints that were satisfied.
  repeated string matched_constraints = 4;

  // Constraints that could not be evaluated.
  repeated string unresolved = 5;

  // Suggested update to the posture, if determinable.
  optional string suggested_update = 6;
}

// ─────────────────────────────────────────────────────────────
// DIS (Decision Integrity State) — signals and audit log
// ─────────────────────────────────────────────────────────────

// DISSignal is an integrity input that may trigger a DIS state transition.
message DISSignal {
  DISSignalType signal_type = 1;
  SignalSeverity severity = 2;
  string description = 3;
  string triggered_by = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

// DISTransitionLog is an immutable audit record of a DIS state transition.
// All transitions MUST be logged with these fields (SPEC §4.4).
message DISTransitionLog {
  google.protobuf.Timestamp timestamp = 1;
  DISState from_state = 2;
  DISState to_state = 3;
  string reason = 4;
  string triggered_by = 5;
}
